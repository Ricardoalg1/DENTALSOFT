# Propone actualizaciones de dependencias cada semana, hacia development (no a main): pasan por el flujo normal
# de PRs y pruebas antes de publicarse. Las de seguridad llegan además como alertas en GitHub.
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    target-branch: development
    schedule: {interval: weekly, day: monday}
    open-pull-requests-limit: 5
    groups:
      parches: {update-types: [patch]}
  - package-ecosystem: npm
    directory: /frontend
    target-branch: development
    schedule: {interval: weekly, day: monday}
    open-pull-requests-limit: 5
    groups:
      parches: {update-types: [patch]}
  - package-ecosystem: npm
    directory: /site
    target-branch: development
    schedule: {interval: weekly, day: monday}
    open-pull-requests-limit: 5
    groups:
      parches: {update-types: [patch]}
  - package-ecosystem: docker
    directories: [/backend, /frontend, /site]
    target-branch: development
    schedule: {interval: weekly, day: monday}
  - package-ecosystem: github-actions
    directory: /
    target-branch: development
    schedule: {interval: monthly}
