name: Dependencias vulnerables
# Revisa con Trivy las librerías del backend, el frontend y el sitio. Falla si hay vulnerabilidades altas o
# críticas que ya tienen versión corregida. Corre también cada lunes: aparecen vulnerabilidades nuevas aunque
# el código no cambie. Si una no se puede corregir aún, se documenta en .trivyignore con el motivo.
on:
  push:
    branches: [development]
  pull_request:
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: seguridad-${{ github.ref }}
  cancel-in-progress: true
jobs:
  trivy:
    name: Dependencias vulnerables
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven, cache-dependency-path: backend/pom.xml}
      # Trivy toma las dependencias transitivas de Maven de ~/.m2: Maven Central limita a quien le consulta mucho.
      - run: chmod +x mvnw && ./mvnw -B -q dependency:resolve
        working-directory: backend
      - name: Trivy
        run: >
          docker run --rm -v "$GITHUB_WORKSPACE:/src:ro" -v "$HOME/.m2:/root/.m2:ro"
          aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
          fs --offline-scan --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
          --skip-dirs '**/node_modules' --skip-dirs backend/target
          --ignorefile /src/.trivyignore /src
