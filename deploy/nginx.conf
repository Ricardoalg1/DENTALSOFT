events { worker_connections 1024; }
http {
  # El único acceso público es Caddy, que sobrescribe esta cabecera.
  limit_req_zone $http_x_occlus_client_ip zone=demo:10m rate=5r/m;
  limit_req_zone $http_x_occlus_client_ip zone=metrics:10m rate=30r/m;
  limit_req_zone $http_x_occlus_client_ip zone=login:10m rate=10r/m;
  limit_req_zone $http_x_occlus_client_ip zone=general:20m rate=300r/m;
  limit_conn_zone $http_x_occlus_client_ip zone=perip:10m;
  limit_req_status 429;
  limit_conn_status 429;
  # Corta conexiones lentas (slowloris) y cuerpos que no terminan de llegar.
  client_header_timeout 10s;
  client_body_timeout 15s;
  send_timeout 30s;
  keepalive_timeout 30s;
  server_tokens off;
  access_log off;
  error_log /dev/stderr warn;
  server {
    listen 80;
    client_max_body_size 16m;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-For $http_x_occlus_client_ip;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 60s;

    # Defensa general por IP: cada visitante, ráfagas cortas y pocas conexiones simultáneas.
    limit_req zone=general burst=150 nodelay;
    limit_conn perip 40;

    # Inicio de sesión y registro: frena la adivinación de contraseñas.
    location ~ ^/(ingresar|registro)$ {
      client_max_body_size 16k;
      limit_req zone=login burst=10 nodelay;
      proxy_pass http://frontend:3000;
    }
    # Solicitudes del chat Occlu: mismo límite que el formulario de demo.
    location = /site-api/chat-lead {
      client_max_body_size 8k;
      limit_req zone=demo burst=5 nodelay;
      proxy_pass http://site:4321;
    }
    location = /demo {
      client_max_body_size 16k;
      limit_req zone=demo burst=5 nodelay;
      proxy_pass http://site:4321;
    }
    location = /site-api/events {
      client_max_body_size 512;
      limit_req zone=metrics burst=10 nodelay;
      proxy_pass http://site:4321;
    }
    location ~ ^/(app|bff|_next)(/|$) { proxy_pass http://frontend:3000; }
    location ~ ^/(salir|pago)(/|$) { proxy_pass http://frontend:3000; }
    location = /api/webhooks/whatsapp { proxy_pass http://backend:8080; }
    # Confirmaciones de las pasarelas de pago: la firma se valida en el backend.
    location ~ ^/api/webhooks/(wompi|epayco)$ { client_max_body_size 64k; proxy_pass http://backend:8080; }
    location / { proxy_pass http://site:4321; }
  }
}
