# Servicios de infraestructura para desarrollo local.
# Uso: docker compose up -d
services:
  postgres:
    image: postgres:17-alpine
    container_name: occlus-postgres
    environment:
      POSTGRES_DB: occlus
      POSTGRES_USER: occlus
      POSTGRES_PASSWORD: occlus
      TZ: America/Bogota
    ports:
      - "5433:5432"   # 5432 del host ya está en uso
    volumes:
      - occlus-pgdata:/var/lib/postgresql/data
      # Solo se ejecuta al crear el volumen por primera vez.
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U occlus -d occlus"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Almacenamiento compatible con S3 para radiografías, fotos y firmas (en producción: AWS S3).
  # MinIO dejó de publicar imágenes gratuitas; SeaweedFS implementa la misma API de S3.
  storage:
    image: chrislusf/seaweedfs:latest
    container_name: occlus-storage
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -master.volumeSizeLimitMB=256
    ports:
      - "8333:8333"
    volumes:
      - occlus-storage:/data
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

volumes:
  occlus-pgdata:
  occlus-storage:
