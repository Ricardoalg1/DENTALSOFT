spring:
  config:
    import:
      - optional:file:${DATAICO_CONFIG_FILE:./dataico.properties}
      - optional:file:${MESSAGING_CONFIG_FILE:./messaging.properties}
  application:
    name: occlus-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/occlus}
    # Rol restringido: las políticas de Row-Level Security le aplican.
    username: ${DB_USER:occlus_app}
    password: ${DB_PASSWORD:occlus_app}
  flyway:
    # Las migraciones corren con el rol dueño del esquema.
    user: ${DB_MIGRATION_USER:occlus}
    password: ${DB_MIGRATION_PASSWORD:occlus}
    placeholders:
      app_role: ${DB_USER:occlus_app}
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 16MB
  devtools:
    restart:
      # Esperar a que javac termine de escribir todas las clases antes de reiniciar en desarrollo
      # (con el valor por defecto, 400 ms, a veces carga una clase a medio escribir: ClassFormatError).
      poll-interval: 3s
      quiet-period: 2s
  jpa:
    # Flyway es dueño del esquema; Hibernate solo valida que las entidades coincidan.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
      org.hibernate.envers:
        audit_table_suffix: _aud
        store_data_at_delete: true

occlus:
  messaging:
    scheduler-enabled: ${MESSAGING_SCHEDULER:false}
    reminder-interval: PT5M
    inbound-interval: PT5S
    whatsapp:
      live-enabled: ${WHATSAPP_LIVE_ENABLED:false}
      clinic-id: ${WHATSAPP_CLINIC_ID:}
      access-token: ${WHATSAPP_ACCESS_TOKEN:}
      phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
      app-secret: ${WHATSAPP_APP_SECRET:}
      verify-token: ${WHATSAPP_VERIFY_TOKEN:}
      api-version: ${WHATSAPP_API_VERSION:v23.0}
      reminder-template: ${WHATSAPP_REMINDER_TEMPLATE:recordatorio_cita}
      template-language: ${WHATSAPP_TEMPLATE_LANGUAGE:es}
    ai:
      enabled: ${MESSAGING_AI_ENABLED:false}
      api-key: ${ANTHROPIC_API_KEY:}
      model: ${OCCLUS_AI_MODEL:claude-opus-5-5}
  dataico:
    auth-token: ${DATAICO_AUTH_TOKEN:}
    account-id: ${DATAICO_ACCOUNT_ID:}
    clinic-id: ${DATAICO_CLINIC_ID:}
    environment: ${DATAICO_ENVIRONMENT:PRUEBAS}
    prefix: ${DATAICO_PREFIX:}
    resolution-number: ${DATAICO_RESOLUTION_NUMBER:}
  storage:
    # Local: SeaweedFS (docker compose). Producción en AWS: dejar endpoint vacío y usar el rol IAM.
    endpoint: ${STORAGE_ENDPOINT:http://localhost:8333}
    region: ${STORAGE_REGION:us-east-1}
    bucket: ${STORAGE_BUCKET:occlus-files}
    access-key: ${STORAGE_ACCESS_KEY:occlus}
    secret-key: ${STORAGE_SECRET_KEY:occlus-dev-secret}
    path-style: ${STORAGE_PATH_STYLE:true}
  jwt:
    # En producción SIEMPRE definir JWT_SECRET (mínimo 32 caracteres).
    secret: ${JWT_SECRET:dev-only-secret-cambiar-en-produccion-0123456789}
    ttl: 8h

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health
